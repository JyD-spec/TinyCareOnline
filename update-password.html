<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - TinyCare</title>
    <!-- Usamos un archivo CSS separado para no afectar el diseño de la página principal (index.html) -->
    <link rel="stylesheet" href="update-password.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🧸 TinyCare</h1>
            </div>
            <div class="body">
                <h2>Crea tu nueva contraseña</h2>
                <p>Asegúrate de usar al menos 6 caracteres.</p>
                
                <div class="input-container">
                    <input type="password" id="password" placeholder="Nueva contraseña">
                    <button type="button" class="toggle-password" id="toggleBtn" title="Mostrar contraseña">
                        👁️
                    </button>
                </div>

                <button class="btn-submit" id="submitBtn">Actualizar contraseña</button>
                <p id="message" class="message"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Lógica para el botón de "Ver contraseña"
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggleBtn');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            // Cambiamos la opacidad para indicar si está activo
            toggleBtn.style.opacity = isPassword ? '1' : '0.5'; 
        });

        // Configuración de Supabase integrada con tus credenciales
        const supabaseUrl = 'https://tjzhtympyevpcwuowbnk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqemh0eW1weWV2cGN3dW93Ym5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MTkzODYsImV4cCI6MjA5MzA5NTM4Nn0.3ayUMpBVAeEBAJio4WwIcepb3K_ErSCmBHU01uXghiY';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Lógica para actualizar la contraseña en la base de datos
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const newPassword = passwordInput.value;
            const messageEl = document.getElementById('message');

            if (!newPassword || newPassword.length < 6) {
                messageEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                messageEl.style.color = '#ff6b6b';
                return;
            }

            messageEl.textContent = 'Actualizando...';
            messageEl.style.color = '#666';

            // Llamada a Supabase para actualizar la contraseña del usuario autenticado por el token del email
            const { error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                messageEl.textContent = 'Error: No se pudo actualizar. El enlace puede haber caducado.';
                messageEl.style.color = '#ff6b6b';
            } else {
                messageEl.textContent = '¡Contraseña actualizada con éxito! Ya puedes volver a la app de TinyCare.';
                messageEl.style.color = '#4CAF50';
                passwordInput.value = '';
            }
        });
    </script>
</body>
</html>
